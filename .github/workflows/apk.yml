name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-res/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Progetto Capacitor
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          npx cap init "DC Asset Engine" it.dcasset.engine --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icone e versione
        run: |
          RES=app/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-res/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp android-res/ic_launcher_round-$d.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" app/android/app/build.gradle
          grep -n "versionCode\|versionName" app/android/app/build.gradle

      - name: Compila
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          IN=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            $BT/apksigner sign --ks ks.jks --ks-key-alias dcae --ks-pass env:KS_PASS --key-pass env:KS_PASS --out DC_Asset_Engine.apk aligned.apk
          else
            echo "::warning::Nessun keystore nei secrets: uso una chiave temporanea (gli aggiornamenti richiederanno di disinstallare)"
            keytool -genkeypair -keystore tmp.jks -alias dcae -keyalg RSA -keysize 2048 -validity 10000 -storepass temp1234 -keypass temp1234 -dname "CN=DC Asset Engine"
            $BT/apksigner sign --ks tmp.jks --ks-key-alias dcae --ks-pass pass:temp1234 --out DC_Asset_Engine.apk aligned.apk
          fi
          $BT/apksigner verify DC_Asset_Engine.apk && ls -la DC_Asset_Engine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DC_Asset_Engine-apk
          path: DC_Asset_Engine.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DC_Asset Engine – app Android 1.${{ github.run_number }}
          body: App di sola consultazione. Scarica DC_Asset_Engine.apk dal telefono e installala.
          files: DC_Asset_Engine.apk
          make_latest: true
